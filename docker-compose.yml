version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mustachphone-app
    container_name: mustachphone-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - NUXT_SECRET=my-super-secret-auth-key-123!
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/phonerepair?schema=public
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: mustachphone-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=phonerepair
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
